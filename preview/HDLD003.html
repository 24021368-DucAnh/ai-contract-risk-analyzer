<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Xem thử highlight điều khoản</title>
  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, sans-serif; color: #1b2633; background: #f2f5f8; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { padding: 18px 24px; background: #17385b; color: white; }
    header h1 { margin: 0 0 4px; font-size: 20px; }
    header p { margin: 0; color: #d7e5f3; font-size: 14px; }
    .layout { display: grid; grid-template-columns: minmax(270px, 360px) minmax(0, 1fr); min-height: calc(100vh - 86px); }
    aside { border-right: 1px solid #d3dce6; background: white; padding: 18px; max-height: calc(100vh - 86px); overflow: auto; }
    main { padding: 22px; min-width: 0; }
    label { display: block; font-weight: 650; margin-bottom: 7px; }
    input, select { width: 100%; padding: 9px 10px; border: 1px solid #aebbc9; border-radius: 7px; font: inherit; background: white; }
    .filters { display: grid; gap: 13px; margin-bottom: 18px; }
    .count { color: #536679; font-size: 13px; margin: 0 0 10px; }
    .clause-list { display: grid; gap: 8px; }
    .clause-button { width: 100%; padding: 11px 12px; text-align: left; border: 1px solid #dae1e8; border-radius: 8px; background: #fff; color: inherit; cursor: pointer; font: inherit; }
    .clause-button:hover, .clause-button:focus-visible { border-color: #216ab2; outline: 2px solid transparent; background: #f0f7ff; }
    .clause-button.selected { border-color: #155a9c; background: #e9f3ff; }
    .clause-id { display: block; font-weight: 700; font-size: 13px; }
    .clause-summary { display: block; color: #536679; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 4px; }
    .badge { display: inline-block; margin-top: 7px; padding: 2px 6px; border-radius: 5px; background: #e1f3e9; color: #17613e; font-size: 11px; font-weight: 700; }
    .badge.context { background: #fff1d9; color: #815000; }
    .panel { background: white; border: 1px solid #dbe3ec; border-radius: 10px; padding: 18px; margin-bottom: 18px; }
    .panel h2 { margin: 0 0 10px; font-size: 17px; }
    .meta { color: #536679; font-size: 13px; margin-bottom: 10px; }
    .note { color: #536679; font-size: 13px; }
    .source { white-space: pre-wrap; overflow-wrap: anywhere; font-family: ui-monospace, Consolas, monospace; line-height: 1.6; font-size: 14px; max-height: 65vh; overflow: auto; }
    mark { background: #ffcf59; color: #162434; border-radius: 3px; padding: 1px 0; box-shadow: 0 0 0 2px #ffcf59; }
    .quote { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.5; }
    @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } aside { max-height: 35vh; border-right: 0; border-bottom: 1px solid #d3dce6; } main { padding: 14px; } }
  </style>
</head>
<body>
  <header><h1>Xem thử highlight điều khoản</h1><p id="contract-summary"></p></header>
  <div class="layout">
    <aside>
      <div class="filters">
        <div><label for="search">Tìm điều khoản</label><input id="search" type="search" placeholder="ID hoặc nội dung"></div>
        <div><label for="quality-filter">Chất lượng offset</label><select id="quality-filter"><option value="ALL">Tất cả</option><option value="EXACT">EXACT</option><option value="CONTEXT">CONTEXT</option></select></div>
      </div>
      <p class="count" id="list-count"></p><div id="clause-list" class="clause-list"></div>
    </aside>
    <main>
      <section class="panel" aria-live="polite">
        <h2 id="selected-title"></h2>
        <div class="meta" id="selected-meta"></div>
        <div class="quote" id="selected-clause"></div>
        <p class="note" id="selected-note"></p>
      </section>
      <section class="panel"><h2>Văn bản gốc</h2><div id="raw-text" class="source" role="region" aria-label="Văn bản hợp đồng"></div></section>
    </main>
  </div>
  <script id="contract-payload" type="application/json">{"contract_id": "HDLD003", "raw_text": "Tên đơn vị:\nSố: …/….\n   CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM\nĐộc lập – Tự do – Hạnh phúc\n\n\n HỢP ĐỒNG LAO ĐỘNG KHÔNG XÁC ĐỊNH THỜI HẠN\nSố: …/HĐLĐ\nHôm nay, ngày ……. tháng ……. năm …..…. Tại ….\nNGƯỜI SỬ DỤNG LAO ĐỘNG (BÊN A): ………\nĐại diện Ông/Bà: …\nChức vụ: …\nĐịa chỉ: …\nĐiện thoại: …\nMã số thuế: …\nSố tài khoản: …\nNGƯỜI LAO ĐỘNG (BÊN B): …\nÔng/Bà: …\nSinh năm: …\nQuốc tich: …\nNghề nghiệp: …\nĐịa chỉ thường trú: …\nSố CCCD: …\nSố sổ lao động (nếu có): …\nCùng thỏa thuận ký kết Hợp đồng lao động (HĐLĐ) và cam kết làm đúng những điều khoản sau đây:\nĐiều 1: Điều khoản chung\nLoại Hợp đồng lao động: …\nĐịa điểm làm việc: …\nBộ phận công tác: Phòng … Chức danh chuyên môn (vị trí công tác): …\nNhiệm vụ công việc như sau:\n– Thực hiện công việc theo đúng chức danh chuyên môn của mình dưới sự quản lý, điều hành của Ban Giám đốc (và các cá nhân được bổ nhiệm hoặc ủy quyền phụ trách).\n– Phối hợp cùng với các bộ phận, phòng ban khác trong Công ty để phát huy tối đa hiệu quả công việc.\n– Hoàn thành những công việc khác tùy thuộc theo yêu cầu kinh doanh của Công ty và theo quyết định của Ban Giám đốc (và các cá nhân được bổ nhiệm hoặc ủy quyền phụ trách).\nĐiều 2: Chế độ làm việc\nThời gian làm việc: …\nTừ ngày thứ ... đến sáng ngày thứ ...:\n– Buổi sáng : ...\n– Buổi chiều: ...\nCó thời gian làm việc tăng ca theo tính chất công việc của công ty và vẫn đảm bảo theo đúng quy định của pháp luật hiện hành về việc làm thêm giờ.\nCông ty sẽ cấp phát các công cụ, thiết bị để phục vụ cho quá trình làm việc.\nĐiều kiện an toàn và vệ sinh lao động tại nơi làm việc theo quy định của pháp luật hiện hành.\nĐiều 3: Nghĩa vụ và quyền lợi của người lao động\nNghĩa vụ\na) Thực hiện công việc với sự tận tâm, tận lực, đảm bảo hoàn thành công việc với hiệu quả cao nhất theo sự phân công, điều hành (bằng văn bản hoặc bằng miệng) của Ban Giám đốc trong Công ty (và các cá nhân được Ban Giám đốc bổ nhiệm hoặc ủy quyền phụ trách).\nb) Hoàn thành công việc được giao và sẵn sàng chấp nhận mọi sự điều động khi có yêu cầu\nc) Nắm rõ và chấp hành nghiêm túc kỷ luật lao động, an toàn lao động, vệ sinh lao động, PCCC, văn hóa công ty, nội quy lao động và các chủ trương, chính sách của Công ty.\nd) Bồi thường vi phạm và vật chất theo quy chế, nội quy của Công ty và pháp luật Nhà nước quy định.\ne) Tham dự đầy đủ, nhiệt tình các buổi huấn luyện, đào tạo, hội thảo do Bộ phận hoặc Công ty tổ chức.\nf) Thực hiện đúng cam kết trong HĐLĐ và các thỏa thuận bằng văn bản khác với Công ty.\ng) Đóng các loại bảo hiểm, các khoản thuế…. đầy đủ theo quy định của pháp luật.\nh) Chế độ đào tạo: Theo quy định của Công ty và yêu cầu công việc. Trong trường hợp Cán bộ nhân viên được cử đi đào tạo thì nhân viên phải hoàn thành khoá học đúng thời hạn, phải cam kết sẽ phục vụ lâu dài cho Công ty sau khi kết thúc khoá học và được hưởng nguyên lương, các quyền lợi khác được hưởng như người đi làm.\ni) Nếu sau khi kết thúc khóa đào tạo mà nhân viên không tiếp tục hợp tác với Công ty thì nhân viên phải hoàn trả lại 100% phí đào tạo và các khoản chế độ đã được nhận trong thời gian đào tạo.\nQuyền lợi\na) Tiền lương và phụ cấp:\n– Mức lương chính: …. VNĐ/tháng.\n– Phụ cấp trách nhiệm: ….. VNĐ/tháng\n– Phụ cấp hiệu suất công việc: Theo đánh giá của quản lý.\n– Lương hiệu quả: Theo quy định của phòng ban, công ty.\n– Công tác phí: Tùy từng vị trí, người lao động được hưởng theo quy định của công ty.\n– Hình thức trả lương: chuyển khoản.\nb) Các quyền lợi khác:\n– Khen thưởng: Người lao động được khuyến khích bằng vật chất và tinh thần khi có thành tích trong công tác hoặc theo quy định của công ty.\n– Chế độ nâng lương: Theo quy định của Nhà nước và quy chế tiền lương của Công ty. Người lao động hoàn thành tốt nhiệm vụ được giao, không vi phạm kỷ luật và/hoặc không trong thời gian xử lý kỷ luật lao động và đủ điều kiện về thời gian theo quy chế lương thì được xét nâng lương.\n– Chế độ nghỉ: Theo quy định chung của Nhà nước\n+ Nghỉ hàng tuần: ...\n+ Nghỉ hàng năm: Những nhân viên được ký Hợp đồng chính thức và có thâm niên công tác 12 tháng thì sẽ được nghỉ phép năm có hưởng lương (01 ngày phép/01 tháng, 12 ngày phép/01 năm). Nhân viên có thâm niên làm việc dưới 12 tháng thì thời gian nghỉ hằng năm được tính theo tỷ lệ tương ứng với số thời gian làm việc.\n+ Nghỉ ngày Lễ: Các ngày nghỉ Lễ pháp định. Các ngày nghỉ lễ nếu trùng với ngày Chủ nhật thì sẽ được nghỉ bù vào ngày trước hoặc ngày kế tiếp tùy theo tình hình cụ thể mà Ban lãnh đạo Công ty sẽ chỉ đạo trực tiếp.\n– Chế độ Bảo hiểm xã hội theo quy định của nhà nước.\n– Các chế độ được hưởng: Người lao động được hưởng các chế độ ngừng việc, trợ cấp thôi việc hoặc bồi thường theo quy định của Pháp luật hiện hành.\n– Thỏa thuận khác: Công ty được quyền chấm dứt Hợp đồng lao động trước thời hạn đối với Người lao động có kết quả đánh giá hiệu suất công việc dưới mức quy định trong 03 tháng liên tục.\nĐiều 4: Nghĩa vụ và quyền hạn của người sử dụng lao động\nNghĩa vụ\nThực hiện đầy đủ những điều kiện cần thiết đã cam kết trong Hợp đồng lao động để người lao động đạt hiệu quả công việc cao. Bảo đảm việc làm cho người lao động theo Hợp đồng đã ký.\nThanh toán đầy đủ, đúng thời hạn các chế độ và quyền lợi cho người lao động theo Hợp đồng lao động.\na) Điều hành người lao động hoàn thành công việc theo Hợp đồng (bố trí, điều chuyển công việc cho người lao động theo đúng chức năng chuyên môn).\nb) Có quyền chuyển tạm thời lao động, ngừng việc, thay đổi, tạm thời chấm dứt Hợp đồng lao động và áp dụng các biện pháp kỷ luật theo quy định của Pháp luật hiện hành và theo nội quy của Công ty trong thời gian hợp đồng còn giá trị.\nc) Tạm hoãn, chấm dứt Hợp đồng, kỷ luật người lao động theo đúng quy định của Pháp luật, và nội quy lao động của Công ty.\nd) Có quyền đòi bồi thường, khiếu nại với cơ quan liên đới để bảo vệ quyền lợi của mình nếu người lao động vi phạm Pháp luật hay các điều khoản của hợp đồng này.\nĐiều 5: Đơn phương chấm dứt hợp đồng\nNgười sử dụng lao động\nTheo quy định tại điều 38 “Bộ luật lao động 2019” thì người sử dụng lao động có quyền đơn phương chấm dứt hợp đồng lao động trong những trường hợp sau đây:\na) Người lao động thường xuyên không hoàn thành công việc theo hợp đồng lao động;\nb) Người lao động bị ốm đau, tai nạn đã điều trị 12 tháng liên tục đối với người làm theo hợp đồng lao động không xác định thời hạn, đã điều trị 06 tháng liên tục, đối với người lao động làm theo hợp đồng lao động xác định thời hạn và quá nửa thời hạn hợp đồng lao động đối với người làm theo hợp đồng lao động theo mùa vụ hoặc theo một công việc nhất định có thời hạn dưới 12 tháng mà khả năng lao động chưa hồi phục.\nc) Do thiên tai, hỏa hoạn hoặc những lý do bất khả kháng khác theo quy định của pháp luật, mà người sử dụng lao động đã tìm mọi biện pháp khắc phục nhưng vẫn buộc phải thu hẹp sản xuất, giảm chỗ làm việc;\nd) Người lao động không có mặt tại nơi làm việc sau thời hạn quy định tại Điều 33 của Bộ luật này.\ne) Doanh nghiệp, cơ quan, tổ chức chấm dứt hoạt động.\nf) Người lao động vi phạm kỷ luật mức sa thải.\ng) Người lao động có hành vi gây thiệt hại nghiêm trọng về tài sản và lợi ích của Công ty.\nh) Người lao động đang thi hành kỷ luật mức chuyển công tác mà tái phạm.\ni) Người lao động tự ý bỏ việc 5 ngày/1 tháng và 20 ngày/1 năm.\nk) Người lao động vi phạm Pháp luật Nhà nước.\nKhi đơn phương chấm dứt hợp đồng lao động người sử dụng lao động phải báo cho người lao động biết trước: Ít nhất 45 ngày.\nTrong thời hạn 07 ngày, kể từ ngày chấm dứt Hợp đồng lao động, hai bên có trách nhiệm thanh toán đầy đủ các khoản có liên quan đến quyền lợi của mỗi bên, trường hợp đặc biệt, có thể kéo dài nhưng không quá 30 ngày.\nTrong trường hợp doanh nghiệp bị phá sản thì các khoản có liên quan đến quyền lợi của người lao động được thanh toán theo quy định của Luật Phá sản doanh nghiệp.\nNgười lao động\nNgười lao động làm việc theo hợp đồng lao động không xác định thời hạn có quyền đơn phương chấm dứt hợp đồng lao động, nhưng phải báo cho người sử dụng lao động biết trước ít nhất 45 ngày.\nĐiều 6: Những thỏa thuận khác\nTrong quá trình thực hiện hợp đồng nếu một bên có nhu cầu thay đổi nội dung trong hợp đồng phải báo cho bên kia trước ít nhất 03 ngày và ký kết bản Phụ lục hợp đồng theo quy định của Pháp luật. Trong thời gian tiến hành thỏa thuận hai bên vẫn tuân theo hợp đồng lao động đã ký kết.\nNgười lao động đọc kỹ, hiểu rõ và cam kết thực hiện các điều khoản và quy định ghi tại Hợp đồng lao động.\nĐiều 7: Điều khoản thi hành\nNhững vấn đề về lao động không ghi trong Hợp đồng lao động này thì áp dụng theo quy định của Thỏa ước tập thể, nội quy lao động và Pháp luật lao động.\nKhi hai bên ký kết Phụ lục hợp đồng lao động thì nội dung của Phụ lục hợp đồng lao động cũng có giá trị như các nội dung của bản hợp đồng này.\nHợp đồng này được lập thành 02 (hai) bản có giá trị như nhau, Hành chính nhân sự giữ 01 (một) bản, Người lao động giữ 01 (một) bản và có hiệu lực kể từ ngày … tháng … năm 20…\nHợp đồng được lập tại:…\nNGƯỜI LAO ĐỘNG                               NGƯỜI SỬ DỤNG LAO ĐỘNG\n(Ký, ghi rõ họ tên)                                          (Ký, ghi rõ họ tên)", "clauses": [{"clause_id": "HDLD003_C001", "section_title": "Điều 1", "clause_text": "Loại Hợp đồng lao động: …", "clause_type": "CONTRACT_TERM", "start_offset": 564, "end_offset": 589, "offset_quality": "EXACT", "highlight_text": "Loại Hợp đồng lao động: …"}, {"clause_id": "HDLD003_C002", "section_title": "Điều 1", "clause_text": "Địa điểm làm việc: …", "clause_type": "JOB_INFO", "start_offset": 590, "end_offset": 610, "offset_quality": "EXACT", "highlight_text": "Địa điểm làm việc: …"}, {"clause_id": "HDLD003_C003", "section_title": "Điều 1", "clause_text": "Bộ phận công tác: Phòng … Chức danh chuyên môn (vị trí công tác): …", "clause_type": "JOB_INFO", "start_offset": 611, "end_offset": 678, "offset_quality": "EXACT", "highlight_text": "Bộ phận công tác: Phòng … Chức danh chuyên môn (vị trí công tác): …"}, {"clause_id": "HDLD003_C004", "section_title": "Điều 1", "clause_text": "Thực hiện công việc theo đúng chức danh chuyên môn của mình dưới sự quản lý, điều hành của Ban Giám đốc (và các cá nhân được bổ nhiệm hoặc ủy quyền phụ trách).", "clause_type": "JOB_INFO", "start_offset": 709, "end_offset": 868, "offset_quality": "EXACT", "highlight_text": "Thực hiện công việc theo đúng chức danh chuyên môn của mình dưới sự quản lý, điều hành của Ban Giám đốc (và các cá nhân được bổ nhiệm hoặc ủy quyền phụ trách)."}, {"clause_id": "HDLD003_C005", "section_title": "Điều 1", "clause_text": "Phối hợp cùng với các bộ phận, phòng ban khác trong Công ty để phát huy tối đa hiệu quả công việc.", "clause_type": "JOB_INFO", "start_offset": 871, "end_offset": 969, "offset_quality": "EXACT", "highlight_text": "Phối hợp cùng với các bộ phận, phòng ban khác trong Công ty để phát huy tối đa hiệu quả công việc."}, {"clause_id": "HDLD003_C006", "section_title": "Điều 1", "clause_text": "Hoàn thành những công việc khác tùy thuộc theo yêu cầu kinh doanh của Công ty và theo quyết định của Ban Giám đốc (và các cá nhân được bổ nhiệm hoặc ủy quyền phụ trách).", "clause_type": "JOB_INFO", "start_offset": 972, "end_offset": 1141, "offset_quality": "EXACT", "highlight_text": "Hoàn thành những công việc khác tùy thuộc theo yêu cầu kinh doanh của Công ty và theo quyết định của Ban Giám đốc (và các cá nhân được bổ nhiệm hoặc ủy quyền phụ trách)."}, {"clause_id": "HDLD003_C007", "section_title": "Điều 2", "clause_text": "Thời gian làm việc: …", "clause_type": "WORKING_TIME", "start_offset": 1166, "end_offset": 1187, "offset_quality": "EXACT", "highlight_text": "Thời gian làm việc: …"}, {"clause_id": "HDLD003_C008", "section_title": "Điều 2", "clause_text": "Từ ngày thứ ... đến sáng ngày thứ ...: – Buổi sáng : ... – Buổi chiều: ...", "clause_type": "WORKING_TIME", "start_offset": 1188, "end_offset": 1262, "offset_quality": "EXACT", "highlight_text": "Từ ngày thứ ... đến sáng ngày thứ ...:\n– Buổi sáng : ...\n– Buổi chiều: ..."}, {"clause_id": "HDLD003_C009", "section_title": "Điều 2", "clause_text": "Có thời gian làm việc tăng ca theo tính chất công việc của công ty và vẫn đảm bảo theo đúng quy định của pháp luật hiện hành về việc làm thêm giờ.", "clause_type": "WORKING_TIME", "start_offset": 1263, "end_offset": 1409, "offset_quality": "EXACT", "highlight_text": "Có thời gian làm việc tăng ca theo tính chất công việc của công ty và vẫn đảm bảo theo đúng quy định của pháp luật hiện hành về việc làm thêm giờ."}, {"clause_id": "HDLD003_C010", "section_title": "Điều 2", "clause_text": "Công ty sẽ cấp phát các công cụ, thiết bị để phục vụ cho quá trình làm việc.", "clause_type": "WORKING_CONDITIONS", "start_offset": 1410, "end_offset": 1486, "offset_quality": "EXACT", "highlight_text": "Công ty sẽ cấp phát các công cụ, thiết bị để phục vụ cho quá trình làm việc."}, {"clause_id": "HDLD003_C011", "section_title": "Điều 2", "clause_text": "Điều kiện an toàn và vệ sinh lao động tại nơi làm việc theo quy định của pháp luật hiện hành.", "clause_type": "INSURANCE_SAFETY", "start_offset": 1487, "end_offset": 1580, "offset_quality": "EXACT", "highlight_text": "Điều kiện an toàn và vệ sinh lao động tại nơi làm việc theo quy định của pháp luật hiện hành."}, {"clause_id": "HDLD003_C012", "section_title": "Điều 3", "clause_text": "Thực hiện công việc với sự tận tâm, tận lực, đảm bảo hoàn thành công việc với hiệu quả cao nhất theo sự phân công, điều hành (bằng văn bản hoặc bằng miệng) của Ban Giám đốc trong Công ty (và các cá nhân được Ban Giám đốc bổ nhiệm hoặc ủy quyền phụ trách).", "clause_type": "EMPLOYEE_OBLIGATIONS_DISCIPLINE", "start_offset": 1642, "end_offset": 1897, "offset_quality": "EXACT", "highlight_text": "Thực hiện công việc với sự tận tâm, tận lực, đảm bảo hoàn thành công việc với hiệu quả cao nhất theo sự phân công, điều hành (bằng văn bản hoặc bằng miệng) của Ban Giám đốc trong Công ty (và các cá nhân được Ban Giám đốc bổ nhiệm hoặc ủy quyền phụ trách)."}, {"clause_id": "HDLD003_C013", "section_title": "Điều 3", "clause_text": "Hoàn thành công việc được giao và sẵn sàng chấp nhận mọi sự điều động khi có yêu cầu", "clause_type": "EMPLOYEE_OBLIGATIONS_DISCIPLINE", "start_offset": 1901, "end_offset": 1985, "offset_quality": "EXACT", "highlight_text": "Hoàn thành công việc được giao và sẵn sàng chấp nhận mọi sự điều động khi có yêu cầu"}, {"clause_id": "HDLD003_C014", "section_title": "Điều 3", "clause_text": "Nắm rõ và chấp hành nghiêm túc kỷ luật lao động, an toàn lao động, vệ sinh lao động, PCCC, văn hóa công ty, nội quy lao động và các chủ trương, chính sách của Công ty.", "clause_type": "EMPLOYEE_OBLIGATIONS_DISCIPLINE", "start_offset": 1989, "end_offset": 2156, "offset_quality": "EXACT", "highlight_text": "Nắm rõ và chấp hành nghiêm túc kỷ luật lao động, an toàn lao động, vệ sinh lao động, PCCC, văn hóa công ty, nội quy lao động và các chủ trương, chính sách của Công ty."}, {"clause_id": "HDLD003_C015", "section_title": "Điều 3", "clause_text": "Bồi thường vi phạm và vật chất theo quy chế, nội quy của Công ty và pháp luật Nhà nước quy định.", "clause_type": "EMPLOYEE_OBLIGATIONS_DISCIPLINE", "start_offset": 2160, "end_offset": 2256, "offset_quality": "EXACT", "highlight_text": "Bồi thường vi phạm và vật chất theo quy chế, nội quy của Công ty và pháp luật Nhà nước quy định."}, {"clause_id": "HDLD003_C016", "section_title": "Điều 3", "clause_text": "Tham dự đầy đủ, nhiệt tình các buổi huấn luyện, đào tạo, hội thảo do Bộ phận hoặc Công ty tổ chức.", "clause_type": "TRAINING", "start_offset": 2260, "end_offset": 2358, "offset_quality": "EXACT", "highlight_text": "Tham dự đầy đủ, nhiệt tình các buổi huấn luyện, đào tạo, hội thảo do Bộ phận hoặc Công ty tổ chức."}, {"clause_id": "HDLD003_C017", "section_title": "Điều 3", "clause_text": "Thực hiện đúng cam kết trong HĐLĐ và các thỏa thuận bằng văn bản khác với Công ty.", "clause_type": "EMPLOYEE_OBLIGATIONS_DISCIPLINE", "start_offset": 2362, "end_offset": 2444, "offset_quality": "EXACT", "highlight_text": "Thực hiện đúng cam kết trong HĐLĐ và các thỏa thuận bằng văn bản khác với Công ty."}, {"clause_id": "HDLD003_C018", "section_title": "Điều 3", "clause_text": "Đóng các loại bảo hiểm đầy đủ theo quy định của pháp luật.", "clause_type": "INSURANCE_SAFETY", "start_offset": 2453, "end_offset": 2470, "offset_quality": "CONTEXT", "highlight_text": "các loại bảo hiểm"}, {"clause_id": "HDLD003_C018A", "section_title": "Điều 3", "clause_text": "Đóng các khoản thuế đầy đủ theo quy định của pháp luật.", "clause_type": "EMPLOYEE_OBLIGATIONS_DISCIPLINE", "start_offset": 2472, "end_offset": 2486, "offset_quality": "CONTEXT", "highlight_text": "các khoản thuế"}, {"clause_id": "HDLD003_C019", "section_title": "Điều 3", "clause_text": "Chế độ đào tạo: Theo quy định của Công ty và yêu cầu công việc. Trong trường hợp Cán bộ nhân viên được cử đi đào tạo thì nhân viên phải hoàn thành khoá học đúng thời hạn, phải cam kết sẽ phục vụ lâu dài cho Công ty sau khi kết thúc khoá học và được hưởng nguyên lương, các quyền lợi khác được hưởng như người đi làm.", "clause_type": "TRAINING", "start_offset": 2528, "end_offset": 2844, "offset_quality": "EXACT", "highlight_text": "Chế độ đào tạo: Theo quy định của Công ty và yêu cầu công việc. Trong trường hợp Cán bộ nhân viên được cử đi đào tạo thì nhân viên phải hoàn thành khoá học đúng thời hạn, phải cam kết sẽ phục vụ lâu dài cho Công ty sau khi kết thúc khoá học và được hưởng nguyên lương, các quyền lợi khác được hưởng như người đi làm."}, {"clause_id": "HDLD003_C020", "section_title": "Điều 3", "clause_text": "Nếu sau khi kết thúc khóa đào tạo mà nhân viên không tiếp tục hợp tác với Công ty thì nhân viên phải hoàn trả lại 100% phí đào tạo và các khoản chế độ đã được nhận trong thời gian đào tạo.", "clause_type": "TRAINING", "start_offset": 2848, "end_offset": 3036, "offset_quality": "EXACT", "highlight_text": "Nếu sau khi kết thúc khóa đào tạo mà nhân viên không tiếp tục hợp tác với Công ty thì nhân viên phải hoàn trả lại 100% phí đào tạo và các khoản chế độ đã được nhận trong thời gian đào tạo."}, {"clause_id": "HDLD003_C021", "section_title": "Điều 3", "clause_text": "Mức lương chính: …. VNĐ/tháng.", "clause_type": "COMPENSATION_BENEFITS", "start_offset": 3075, "end_offset": 3105, "offset_quality": "EXACT", "highlight_text": "Mức lương chính: …. VNĐ/tháng."}, {"clause_id": "HDLD003_C022", "section_title": "Điều 3", "clause_text": "Phụ cấp trách nhiệm: ….. VNĐ/tháng", "clause_type": "COMPENSATION_BENEFITS", "start_offset": 3108, "end_offset": 3142, "offset_quality": "EXACT", "highlight_text": "Phụ cấp trách nhiệm: ….. VNĐ/tháng"}, {"clause_id": "HDLD003_C023", "section_title": "Điều 3", "clause_text": "Phụ cấp hiệu suất công việc: Theo đánh giá của quản lý.", "clause_type": "COMPENSATION_BENEFITS", "start_offset": 3145, "end_offset": 3200, "offset_quality": "EXACT", "highlight_text": "Phụ cấp hiệu suất công việc: Theo đánh giá của quản lý."}, {"clause_id": "HDLD003_C024", "section_title": "Điều 3", "clause_text": "Lương hiệu quả: Theo quy định của phòng ban, công ty.", "clause_type": "COMPENSATION_BENEFITS", "start_offset": 3203, "end_offset": 3256, "offset_quality": "EXACT", "highlight_text": "Lương hiệu quả: Theo quy định của phòng ban, công ty."}, {"clause_id": "HDLD003_C025", "section_title": "Điều 3", "clause_text": "Công tác phí: Tùy từng vị trí, người lao động được hưởng theo quy định của công ty.", "clause_type": "COMPENSATION_BENEFITS", "start_offset": 3259, "end_offset": 3342, "offset_quality": "EXACT", "highlight_text": "Công tác phí: Tùy từng vị trí, người lao động được hưởng theo quy định của công ty."}, {"clause_id": "HDLD003_C026", "section_title": "Điều 3", "clause_text": "Hình thức trả lương: chuyển khoản.", "clause_type": "COMPENSATION_BENEFITS", "start_offset": 3345, "end_offset": 3379, "offset_quality": "EXACT", "highlight_text": "Hình thức trả lương: chuyển khoản."}, {"clause_id": "HDLD003_C027", "section_title": "Điều 3", "clause_text": "Khen thưởng: Người lao động được khuyến khích bằng vật chất và tinh thần khi có thành tích trong công tác hoặc theo quy định của công ty.", "clause_type": "COMPENSATION_BENEFITS", "start_offset": 3405, "end_offset": 3542, "offset_quality": "EXACT", "highlight_text": "Khen thưởng: Người lao động được khuyến khích bằng vật chất và tinh thần khi có thành tích trong công tác hoặc theo quy định của công ty."}, {"clause_id": "HDLD003_C028", "section_title": "Điều 3", "clause_text": "Chế độ nâng lương: Theo quy định của Nhà nước và quy chế tiền lương của Công ty. Người lao động hoàn thành tốt nhiệm vụ được giao, không vi phạm kỷ luật và/hoặc không trong thời gian xử lý kỷ luật lao động và đủ điều kiện về thời gian theo quy chế lương thì được xét nâng lương.", "clause_type": "COMPENSATION_BENEFITS", "start_offset": 3545, "end_offset": 3823, "offset_quality": "EXACT", "highlight_text": "Chế độ nâng lương: Theo quy định của Nhà nước và quy chế tiền lương của Công ty. Người lao động hoàn thành tốt nhiệm vụ được giao, không vi phạm kỷ luật và/hoặc không trong thời gian xử lý kỷ luật lao động và đủ điều kiện về thời gian theo quy chế lương thì được xét nâng lương."}, {"clause_id": "HDLD003_C029", "section_title": "Điều 3", "clause_text": "Nghỉ hàng tuần: ...", "clause_type": "LEAVE", "start_offset": 3874, "end_offset": 3893, "offset_quality": "EXACT", "highlight_text": "Nghỉ hàng tuần: ..."}, {"clause_id": "HDLD003_C030", "section_title": "Điều 3", "clause_text": "Nghỉ hàng năm: Những nhân viên được ký Hợp đồng chính thức và có thâm niên công tác 12 tháng thì sẽ được nghỉ phép năm có hưởng lương (01 ngày phép/01 tháng, 12 ngày phép/01 năm). Nhân viên có thâm niên làm việc dưới 12 tháng thì thời gian nghỉ hằng năm được tính theo tỷ lệ tương ứng với số thời gian làm việc.", "clause_type": "LEAVE", "start_offset": 3896, "end_offset": 4207, "offset_quality": "EXACT", "highlight_text": "Nghỉ hàng năm: Những nhân viên được ký Hợp đồng chính thức và có thâm niên công tác 12 tháng thì sẽ được nghỉ phép năm có hưởng lương (01 ngày phép/01 tháng, 12 ngày phép/01 năm). Nhân viên có thâm niên làm việc dưới 12 tháng thì thời gian nghỉ hằng năm được tính theo tỷ lệ tương ứng với số thời gian làm việc."}, {"clause_id": "HDLD003_C031", "section_title": "Điều 3", "clause_text": "Nghỉ ngày Lễ: Các ngày nghỉ Lễ pháp định. Các ngày nghỉ lễ nếu trùng với ngày Chủ nhật thì sẽ được nghỉ bù vào ngày trước hoặc ngày kế tiếp tùy theo tình hình cụ thể mà Ban lãnh đạo Công ty sẽ chỉ đạo trực tiếp.", "clause_type": "LEAVE", "start_offset": 4210, "end_offset": 4421, "offset_quality": "EXACT", "highlight_text": "Nghỉ ngày Lễ: Các ngày nghỉ Lễ pháp định. Các ngày nghỉ lễ nếu trùng với ngày Chủ nhật thì sẽ được nghỉ bù vào ngày trước hoặc ngày kế tiếp tùy theo tình hình cụ thể mà Ban lãnh đạo Công ty sẽ chỉ đạo trực tiếp."}, {"clause_id": "HDLD003_C032", "section_title": "Điều 3", "clause_text": "Chế độ Bảo hiểm xã hội theo quy định của nhà nước.", "clause_type": "INSURANCE_SAFETY", "start_offset": 4424, "end_offset": 4474, "offset_quality": "EXACT", "highlight_text": "Chế độ Bảo hiểm xã hội theo quy định của nhà nước."}, {"clause_id": "HDLD003_C033", "section_title": "Điều 3", "clause_text": "Các chế độ được hưởng: Người lao động được hưởng các chế độ ngừng việc, trợ cấp thôi việc hoặc bồi thường theo quy định của Pháp luật hiện hành.", "clause_type": "COMPENSATION_BENEFITS", "start_offset": 4477, "end_offset": 4621, "offset_quality": "EXACT", "highlight_text": "Các chế độ được hưởng: Người lao động được hưởng các chế độ ngừng việc, trợ cấp thôi việc hoặc bồi thường theo quy định của Pháp luật hiện hành."}, {"clause_id": "HDLD003_C034", "section_title": "Điều 3", "clause_text": "Thỏa thuận khác: Công ty được quyền chấm dứt Hợp đồng lao động trước thời hạn đối với Người lao động có kết quả đánh giá hiệu suất công việc dưới mức quy định trong 03 tháng liên tục.", "clause_type": "TERMINATION", "start_offset": 4624, "end_offset": 4807, "offset_quality": "EXACT", "highlight_text": "Thỏa thuận khác: Công ty được quyền chấm dứt Hợp đồng lao động trước thời hạn đối với Người lao động có kết quả đánh giá hiệu suất công việc dưới mức quy định trong 03 tháng liên tục."}, {"clause_id": "HDLD003_C035", "section_title": "Điều 4", "clause_text": "Thực hiện đầy đủ những điều kiện cần thiết đã cam kết trong Hợp đồng lao động để người lao động đạt hiệu quả công việc cao. Bảo đảm việc làm cho người lao động theo Hợp đồng đã ký.", "clause_type": "EMPLOYER_RIGHTS_OBLIGATIONS", "start_offset": 4874, "end_offset": 5054, "offset_quality": "EXACT", "highlight_text": "Thực hiện đầy đủ những điều kiện cần thiết đã cam kết trong Hợp đồng lao động để người lao động đạt hiệu quả công việc cao. Bảo đảm việc làm cho người lao động theo Hợp đồng đã ký."}, {"clause_id": "HDLD003_C036", "section_title": "Điều 4", "clause_text": "Thanh toán đầy đủ, đúng thời hạn các chế độ và quyền lợi cho người lao động theo Hợp đồng lao động.", "clause_type": "EMPLOYER_RIGHTS_OBLIGATIONS", "start_offset": 5055, "end_offset": 5154, "offset_quality": "EXACT", "highlight_text": "Thanh toán đầy đủ, đúng thời hạn các chế độ và quyền lợi cho người lao động theo Hợp đồng lao động."}, {"clause_id": "HDLD003_C037", "section_title": "Điều 4", "clause_text": "Điều hành người lao động hoàn thành công việc theo Hợp đồng (bố trí, điều chuyển công việc cho người lao động theo đúng chức năng chuyên môn).", "clause_type": "EMPLOYER_RIGHTS_OBLIGATIONS", "start_offset": 5158, "end_offset": 5300, "offset_quality": "EXACT", "highlight_text": "Điều hành người lao động hoàn thành công việc theo Hợp đồng (bố trí, điều chuyển công việc cho người lao động theo đúng chức năng chuyên môn)."}, {"clause_id": "HDLD003_C038", "section_title": "Điều 4", "clause_text": "Có quyền chuyển tạm thời lao động, ngừng việc, thay đổi, tạm thời chấm dứt Hợp đồng lao động và áp dụng các biện pháp kỷ luật theo quy định của Pháp luật hiện hành và theo nội quy của Công ty trong thời gian hợp đồng còn giá trị.", "clause_type": "EMPLOYER_RIGHTS_OBLIGATIONS", "start_offset": 5304, "end_offset": 5533, "offset_quality": "EXACT", "highlight_text": "Có quyền chuyển tạm thời lao động, ngừng việc, thay đổi, tạm thời chấm dứt Hợp đồng lao động và áp dụng các biện pháp kỷ luật theo quy định của Pháp luật hiện hành và theo nội quy của Công ty trong thời gian hợp đồng còn giá trị."}, {"clause_id": "HDLD003_C039", "section_title": "Điều 4", "clause_text": "Tạm hoãn, chấm dứt Hợp đồng, kỷ luật người lao động theo đúng quy định của Pháp luật, và nội quy lao động của Công ty.", "clause_type": "EMPLOYER_RIGHTS_OBLIGATIONS", "start_offset": 5537, "end_offset": 5655, "offset_quality": "EXACT", "highlight_text": "Tạm hoãn, chấm dứt Hợp đồng, kỷ luật người lao động theo đúng quy định của Pháp luật, và nội quy lao động của Công ty."}, {"clause_id": "HDLD003_C040", "section_title": "Điều 4", "clause_text": "Có quyền đòi bồi thường, khiếu nại với cơ quan liên đới để bảo vệ quyền lợi của mình nếu người lao động vi phạm Pháp luật hay các điều khoản của hợp đồng này.", "clause_type": "EMPLOYER_RIGHTS_OBLIGATIONS", "start_offset": 5659, "end_offset": 5817, "offset_quality": "EXACT", "highlight_text": "Có quyền đòi bồi thường, khiếu nại với cơ quan liên đới để bảo vệ quyền lợi của mình nếu người lao động vi phạm Pháp luật hay các điều khoản của hợp đồng này."}, {"clause_id": "HDLD003_C041", "section_title": "Điều 5", "clause_text": "Người lao động thường xuyên không hoàn thành công việc theo hợp đồng lao động;", "clause_type": "TERMINATION", "start_offset": 6037, "end_offset": 6115, "offset_quality": "EXACT", "highlight_text": "Người lao động thường xuyên không hoàn thành công việc theo hợp đồng lao động;"}, {"clause_id": "HDLD003_C042", "section_title": "Điều 5", "clause_text": "Người lao động bị ốm đau, tai nạn đã điều trị 12 tháng liên tục đối với người làm theo hợp đồng lao động không xác định thời hạn, đã điều trị 06 tháng liên tục, đối với người lao động làm theo hợp đồng lao động xác định thời hạn và quá nửa thời hạn hợp đồng lao động đối với người làm theo hợp đồng lao động theo mùa vụ hoặc theo một công việc nhất định có thời hạn dưới 12 tháng mà khả năng lao động chưa hồi phục.", "clause_type": "TERMINATION", "start_offset": 6119, "end_offset": 6534, "offset_quality": "EXACT", "highlight_text": "Người lao động bị ốm đau, tai nạn đã điều trị 12 tháng liên tục đối với người làm theo hợp đồng lao động không xác định thời hạn, đã điều trị 06 tháng liên tục, đối với người lao động làm theo hợp đồng lao động xác định thời hạn và quá nửa thời hạn hợp đồng lao động đối với người làm theo hợp đồng lao động theo mùa vụ hoặc theo một công việc nhất định có thời hạn dưới 12 tháng mà khả năng lao động chưa hồi phục."}, {"clause_id": "HDLD003_C043", "section_title": "Điều 5", "clause_text": "Do thiên tai, hỏa hoạn hoặc những lý do bất khả kháng khác theo quy định của pháp luật, mà người sử dụng lao động đã tìm mọi biện pháp khắc phục nhưng vẫn buộc phải thu hẹp sản xuất, giảm chỗ làm việc;", "clause_type": "TERMINATION", "start_offset": 6538, "end_offset": 6739, "offset_quality": "EXACT", "highlight_text": "Do thiên tai, hỏa hoạn hoặc những lý do bất khả kháng khác theo quy định của pháp luật, mà người sử dụng lao động đã tìm mọi biện pháp khắc phục nhưng vẫn buộc phải thu hẹp sản xuất, giảm chỗ làm việc;"}, {"clause_id": "HDLD003_C044", "section_title": "Điều 5", "clause_text": "Người lao động không có mặt tại nơi làm việc sau thời hạn quy định tại Điều 33 của Bộ luật này.", "clause_type": "TERMINATION", "start_offset": 6743, "end_offset": 6838, "offset_quality": "EXACT", "highlight_text": "Người lao động không có mặt tại nơi làm việc sau thời hạn quy định tại Điều 33 của Bộ luật này."}, {"clause_id": "HDLD003_C045", "section_title": "Điều 5", "clause_text": "Doanh nghiệp, cơ quan, tổ chức chấm dứt hoạt động.", "clause_type": "TERMINATION", "start_offset": 6842, "end_offset": 6892, "offset_quality": "EXACT", "highlight_text": "Doanh nghiệp, cơ quan, tổ chức chấm dứt hoạt động."}, {"clause_id": "HDLD003_C046", "section_title": "Điều 5", "clause_text": "Người lao động vi phạm kỷ luật mức sa thải.", "clause_type": "TERMINATION", "start_offset": 6896, "end_offset": 6939, "offset_quality": "EXACT", "highlight_text": "Người lao động vi phạm kỷ luật mức sa thải."}, {"clause_id": "HDLD003_C047", "section_title": "Điều 5", "clause_text": "Người lao động có hành vi gây thiệt hại nghiêm trọng về tài sản và lợi ích của Công ty.", "clause_type": "TERMINATION", "start_offset": 6943, "end_offset": 7030, "offset_quality": "EXACT", "highlight_text": "Người lao động có hành vi gây thiệt hại nghiêm trọng về tài sản và lợi ích của Công ty."}, {"clause_id": "HDLD003_C048", "section_title": "Điều 5", "clause_text": "Người lao động đang thi hành kỷ luật mức chuyển công tác mà tái phạm.", "clause_type": "TERMINATION", "start_offset": 7034, "end_offset": 7103, "offset_quality": "EXACT", "highlight_text": "Người lao động đang thi hành kỷ luật mức chuyển công tác mà tái phạm."}, {"clause_id": "HDLD003_C049", "section_title": "Điều 5", "clause_text": "Người lao động tự ý bỏ việc 5 ngày/1 tháng và 20 ngày/1 năm.", "clause_type": "TERMINATION", "start_offset": 7107, "end_offset": 7167, "offset_quality": "EXACT", "highlight_text": "Người lao động tự ý bỏ việc 5 ngày/1 tháng và 20 ngày/1 năm."}, {"clause_id": "HDLD003_C050", "section_title": "Điều 5", "clause_text": "Người lao động vi phạm Pháp luật Nhà nước.", "clause_type": "TERMINATION", "start_offset": 7171, "end_offset": 7213, "offset_quality": "EXACT", "highlight_text": "Người lao động vi phạm Pháp luật Nhà nước."}, {"clause_id": "HDLD003_C051", "section_title": "Điều 5", "clause_text": "Khi đơn phương chấm dứt hợp đồng lao động người sử dụng lao động phải báo cho người lao động biết trước: Ít nhất 45 ngày.", "clause_type": "TERMINATION", "start_offset": 7214, "end_offset": 7335, "offset_quality": "EXACT", "highlight_text": "Khi đơn phương chấm dứt hợp đồng lao động người sử dụng lao động phải báo cho người lao động biết trước: Ít nhất 45 ngày."}, {"clause_id": "HDLD003_C052", "section_title": "Điều 5", "clause_text": "Trong thời hạn 07 ngày, kể từ ngày chấm dứt Hợp đồng lao động, hai bên có trách nhiệm thanh toán đầy đủ các khoản có liên quan đến quyền lợi của mỗi bên, trường hợp đặc biệt, có thể kéo dài nhưng không quá 30 ngày.", "clause_type": "TERMINATION", "start_offset": 7336, "end_offset": 7550, "offset_quality": "EXACT", "highlight_text": "Trong thời hạn 07 ngày, kể từ ngày chấm dứt Hợp đồng lao động, hai bên có trách nhiệm thanh toán đầy đủ các khoản có liên quan đến quyền lợi của mỗi bên, trường hợp đặc biệt, có thể kéo dài nhưng không quá 30 ngày."}, {"clause_id": "HDLD003_C053", "section_title": "Điều 5", "clause_text": "Trong trường hợp doanh nghiệp bị phá sản thì các khoản có liên quan đến quyền lợi của người lao động được thanh toán theo quy định của Luật Phá sản doanh nghiệp.", "clause_type": "TERMINATION", "start_offset": 7551, "end_offset": 7712, "offset_quality": "EXACT", "highlight_text": "Trong trường hợp doanh nghiệp bị phá sản thì các khoản có liên quan đến quyền lợi của người lao động được thanh toán theo quy định của Luật Phá sản doanh nghiệp."}, {"clause_id": "HDLD003_C054", "section_title": "Điều 5", "clause_text": "Người lao động làm việc theo hợp đồng lao động không xác định thời hạn có quyền đơn phương chấm dứt hợp đồng lao động, nhưng phải báo cho người sử dụng lao động biết trước ít nhất 45 ngày.", "clause_type": "TERMINATION", "start_offset": 7728, "end_offset": 7916, "offset_quality": "EXACT", "highlight_text": "Người lao động làm việc theo hợp đồng lao động không xác định thời hạn có quyền đơn phương chấm dứt hợp đồng lao động, nhưng phải báo cho người sử dụng lao động biết trước ít nhất 45 ngày."}, {"clause_id": "HDLD003_C055", "section_title": "Điều 6", "clause_text": "Trong quá trình thực hiện hợp đồng nếu một bên có nhu cầu thay đổi nội dung trong hợp đồng phải báo cho bên kia trước ít nhất 03 ngày và ký kết bản Phụ lục hợp đồng theo quy định của Pháp luật. Trong thời gian tiến hành thỏa thuận hai bên vẫn tuân theo hợp đồng lao động đã ký kết.", "clause_type": "OTHER", "start_offset": 7947, "end_offset": 8228, "offset_quality": "EXACT", "highlight_text": "Trong quá trình thực hiện hợp đồng nếu một bên có nhu cầu thay đổi nội dung trong hợp đồng phải báo cho bên kia trước ít nhất 03 ngày và ký kết bản Phụ lục hợp đồng theo quy định của Pháp luật. Trong thời gian tiến hành thỏa thuận hai bên vẫn tuân theo hợp đồng lao động đã ký kết."}, {"clause_id": "HDLD003_C056", "section_title": "Điều 6", "clause_text": "Người lao động đọc kỹ, hiểu rõ và cam kết thực hiện các điều khoản và quy định ghi tại Hợp đồng lao động.", "clause_type": "OTHER", "start_offset": 8229, "end_offset": 8334, "offset_quality": "EXACT", "highlight_text": "Người lao động đọc kỹ, hiểu rõ và cam kết thực hiện các điều khoản và quy định ghi tại Hợp đồng lao động."}, {"clause_id": "HDLD003_C057", "section_title": "Điều 7", "clause_text": "Những vấn đề về lao động không ghi trong Hợp đồng lao động này thì áp dụng theo quy định của Thỏa ước tập thể, nội quy lao động và Pháp luật lao động.", "clause_type": "OTHER", "start_offset": 8363, "end_offset": 8513, "offset_quality": "EXACT", "highlight_text": "Những vấn đề về lao động không ghi trong Hợp đồng lao động này thì áp dụng theo quy định của Thỏa ước tập thể, nội quy lao động và Pháp luật lao động."}, {"clause_id": "HDLD003_C058", "section_title": "Điều 7", "clause_text": "Khi hai bên ký kết Phụ lục hợp đồng lao động thì nội dung của Phụ lục hợp đồng lao động cũng có giá trị như các nội dung của bản hợp đồng này.", "clause_type": "OTHER", "start_offset": 8514, "end_offset": 8656, "offset_quality": "EXACT", "highlight_text": "Khi hai bên ký kết Phụ lục hợp đồng lao động thì nội dung của Phụ lục hợp đồng lao động cũng có giá trị như các nội dung của bản hợp đồng này."}, {"clause_id": "HDLD003_C059", "section_title": "Điều 7", "clause_text": "Hợp đồng này được lập thành 02 (hai) bản có giá trị như nhau, Hành chính nhân sự giữ 01 (một) bản, Người lao động giữ 01 (một) bản và có hiệu lực kể từ ngày … tháng … năm 20…", "clause_type": "OTHER", "start_offset": 8657, "end_offset": 8831, "offset_quality": "EXACT", "highlight_text": "Hợp đồng này được lập thành 02 (hai) bản có giá trị như nhau, Hành chính nhân sự giữ 01 (một) bản, Người lao động giữ 01 (một) bản và có hiệu lực kể từ ngày … tháng … năm 20…"}, {"clause_id": "HDLD003_C060", "section_title": "Điều 7", "clause_text": "Hợp đồng được lập tại:…", "clause_type": "OTHER", "start_offset": 8832, "end_offset": 8855, "offset_quality": "EXACT", "highlight_text": "Hợp đồng được lập tại:…"}]}</script>
  <script>
    const payload = JSON.parse(document.getElementById("contract-payload").textContent);
    const chars = Array.from(payload.raw_text);
    const list = document.getElementById("clause-list");
    const raw = document.getElementById("raw-text");
    const search = document.getElementById("search");
    const filter = document.getElementById("quality-filter");
    let selectedId = payload.clauses.find(row => row.clause_id === "HDLD003_C018")?.clause_id || payload.clauses[0]?.clause_id;

    const exactCount = payload.clauses.filter(row => row.offset_quality === "EXACT").length;
    document.getElementById("contract-summary").textContent = `${payload.contract_id} · ${payload.clauses.length} điều khoản · ${exactCount} EXACT · ${payload.clauses.length - exactCount} CONTEXT`;

    function showClause(row) {
      selectedId = row.clause_id;
      document.getElementById("selected-title").textContent = row.clause_id;
      document.getElementById("selected-meta").textContent = `${row.section_title} · ${row.clause_type} · ${row.offset_quality} · [${row.start_offset}, ${row.end_offset})`;
      document.getElementById("selected-clause").textContent = row.clause_text;
      document.getElementById("selected-note").textContent = row.offset_quality === "EXACT"
        ? "Đoạn bôi khớp điều khoản sau khi chuẩn hóa khoảng trắng."
        : "Đoạn bôi là cụm từ nguồn liên quan; điều khoản đã được tách/chuẩn hóa nên không khớp nguyên văn toàn câu.";
      const before = document.createTextNode(chars.slice(0, row.start_offset).join(""));
      const mark = document.createElement("mark");
      mark.id = "active-highlight";
      mark.textContent = chars.slice(row.start_offset, row.end_offset).join("");
      const after = document.createTextNode(chars.slice(row.end_offset).join(""));
      raw.replaceChildren(before, mark, after);
      requestAnimationFrame(() => mark.scrollIntoView({block: "center", behavior: "instant"}));
    }

    function showList() {
      const term = search.value.trim().toLocaleLowerCase("vi");
      const quality = filter.value;
      const visible = payload.clauses.filter(row =>
        (quality === "ALL" || row.offset_quality === quality) &&
        (!term || `${row.clause_id} ${row.clause_text}`.toLocaleLowerCase("vi").includes(term))
      );
      document.getElementById("list-count").textContent = `${visible.length} / ${payload.clauses.length} điều khoản`;
      list.replaceChildren();
      for (const row of visible) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "clause-button" + (row.clause_id === selectedId ? " selected" : "");
        button.dataset.clauseId = row.clause_id;
        const id = document.createElement("span");
        id.className = "clause-id";
        id.textContent = `${row.clause_id} · ${row.section_title}`;
        const summary = document.createElement("span");
        summary.className = "clause-summary";
        summary.textContent = row.clause_text;
        const badge = document.createElement("span");
        badge.className = "badge" + (row.offset_quality === "CONTEXT" ? " context" : "");
        badge.textContent = row.offset_quality;
        button.append(id, summary, badge);
        button.addEventListener("click", () => { showClause(row); showList(); });
        list.append(button);
      }
    }

    search.addEventListener("input", showList);
    filter.addEventListener("change", showList);
    showList();
    if (selectedId) showClause(payload.clauses.find(row => row.clause_id === selectedId));
  </script>
