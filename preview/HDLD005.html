<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Xem thử highlight điều khoản</title>
  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, sans-serif; color: #1b2633; background: #f2f5f8; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { padding: 18px 24px; background: #17385b; color: white; }
    header h1 { margin: 0 0 4px; font-size: 20px; }
    header p { margin: 0; color: #d7e5f3; font-size: 14px; }
    .layout { display: grid; grid-template-columns: minmax(270px, 360px) minmax(0, 1fr); min-height: calc(100vh - 86px); }
    aside { border-right: 1px solid #d3dce6; background: white; padding: 18px; max-height: calc(100vh - 86px); overflow: auto; }
    main { padding: 22px; min-width: 0; }
    label { display: block; font-weight: 650; margin-bottom: 7px; }
    input, select { width: 100%; padding: 9px 10px; border: 1px solid #aebbc9; border-radius: 7px; font: inherit; background: white; }
    .filters { display: grid; gap: 13px; margin-bottom: 18px; }
    .count { color: #536679; font-size: 13px; margin: 0 0 10px; }
    .clause-list { display: grid; gap: 8px; }
    .clause-button { width: 100%; padding: 11px 12px; text-align: left; border: 1px solid #dae1e8; border-radius: 8px; background: #fff; color: inherit; cursor: pointer; font: inherit; }
    .clause-button:hover, .clause-button:focus-visible { border-color: #216ab2; outline: 2px solid transparent; background: #f0f7ff; }
    .clause-button.selected { border-color: #155a9c; background: #e9f3ff; }
    .clause-id { display: block; font-weight: 700; font-size: 13px; }
    .clause-summary { display: block; color: #536679; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 4px; }
    .badge { display: inline-block; margin-top: 7px; padding: 2px 6px; border-radius: 5px; background: #e1f3e9; color: #17613e; font-size: 11px; font-weight: 700; }
    .badge.context { background: #fff1d9; color: #815000; }
    .panel { background: white; border: 1px solid #dbe3ec; border-radius: 10px; padding: 18px; margin-bottom: 18px; }
    .panel h2 { margin: 0 0 10px; font-size: 17px; }
    .meta { color: #536679; font-size: 13px; margin-bottom: 10px; }
    .note { color: #536679; font-size: 13px; }
    .source { white-space: pre-wrap; overflow-wrap: anywhere; font-family: ui-monospace, Consolas, monospace; line-height: 1.6; font-size: 14px; max-height: 65vh; overflow: auto; }
    mark { background: #ffcf59; color: #162434; border-radius: 3px; padding: 1px 0; box-shadow: 0 0 0 2px #ffcf59; }
    .quote { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.5; }
    @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } aside { max-height: 35vh; border-right: 0; border-bottom: 1px solid #d3dce6; } main { padding: 14px; } }
  </style>
</head>
<body>
  <header><h1>Xem thử highlight điều khoản</h1><p id="contract-summary"></p></header>
  <div class="layout">
    <aside>
      <div class="filters">
        <div><label for="search">Tìm điều khoản</label><input id="search" type="search" placeholder="ID hoặc nội dung"></div>
        <div><label for="quality-filter">Chất lượng offset</label><select id="quality-filter"><option value="ALL">Tất cả</option><option value="EXACT">EXACT</option><option value="CONTEXT">CONTEXT</option></select></div>
      </div>
      <p class="count" id="list-count"></p><div id="clause-list" class="clause-list"></div>
    </aside>
    <main>
      <section class="panel" aria-live="polite">
        <h2 id="selected-title"></h2>
        <div class="meta" id="selected-meta"></div>
        <div class="quote" id="selected-clause"></div>
        <p class="note" id="selected-note"></p>
      </section>
      <section class="panel"><h2>Văn bản gốc</h2><div id="raw-text" class="source" role="region" aria-label="Văn bản hợp đồng"></div></section>
    </main>
  </div>
  <script id="contract-payload" type="application/json">{"contract_id": "HDLD005", "raw_text": "PHỤ LỤC II\n(Ban hành kèm theo Thông tư số 5/2023/TT-BNV ngày 03/5/2023 của Bộ trưởng Bộ Nội vụ hướng dẫn mẫu hợp đồng dịch vụ và mẫu hợp đồng lao động đối với một số loại công việc trong cơ quan hành chính và đơn vị sự nghiệp công lập)\nBộ, ngành, địa phương: ............ Đơn vị: ....................................... -------\n CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM Độc lập - Tự do - Hạnh phúc ---------------\n\n Số:        /HĐLĐ\n ............., ngày ...... tháng ...... năm ......\n\n\nHỢP ĐỒNG LAO ĐỘNG\nTHỰC HIỆN CÔNG VIỆC HỖ TRỢ, PHỤC VỤ\nCăn cứ Bộ luật Lao động ngày 20 tháng 11 năm 2019;\nCăn cứ Nghị định số 111/2022/NĐ-CP ngày 30 tháng 12 năm 2022 của Chính phủ về hợp đồng đối với một số loại công việc trong cơ quan hành chính và đơn vị sự nghiệp công lập;\nCăn cứ ………………….;\nCăn cứ nhu cầu và khả năng thực tế của các bên trong hợp đồng;\nHôm nay, ngày … tháng … năm … tại (Tên cơ quan, đơn vị) ......................., chúng tôi gồm các bên dưới đây:\nBÊN A: NGƯỜI SỬ DỤNG LAO ĐỘNG\nCơ quan, đơn vị:....................................................................................................................\nĐịa chỉ:...................................................................................................................................\nĐiện thoại: .............................................................................................................................\nMã số thuế (nếu có): .............................................................................................................\nTài khoản ngân hàng: ...........................................................................................................\nNơi mở tài khoản: .................................................................................................................\nĐại diện theo pháp luật (hoặc người được uỷ quyền):..........................................................\nVăn bản uỷ quyền ký hợp đồng số: …. ngày …. tháng …. năm ….(trường hợp được uỷ quyền)\nChức vụ: ...............................................................................................................................\nBÊN B: NGƯỜI LAO ĐỘNG\nÔng/Bà: ................................................................................................................................\nSinh ngày: ….. tháng ….. năm ….. Tại:................................................................................\nGiới tính: ...............................................................................................................................\nĐịa chỉ nơi cư trú: .................................................................................................................\nĐiện thoại: .............................................................................................................................\nMã số thuế (nếu có): .............................................................................................................\nTài khoản ngân hàng: ...........................................................................................................\nNơi mở tài khoản: .................................................................................................................\nEmail (nếu có): ......................................................................................................................\nSố CMND/CCCD/Hộ chiếu: ............. Cấp ngày: ................Tại: ............................................\nHai bên thoả thuận ký kết hợp đồng lao động và cam kết thực hiện những nội dung sau đây:\nĐiều 1. Công việc, vị trí việc làm và thời hạn hợp đồng\n1. Thời hạn hợp đồng\n(Lựa chọn một trong hai loại hợp đồng sau đây)\n(1.1)\nBên A và bên B thỏa thuận ký kết hợp đồng xác định thời hạn, cụ thể như sau:\nThời hạn của hợp đồng lao động: …. tháng1, kể từ ngày ...... tháng ...... năm ...... đến ngày ...... tháng ...... năm ......, trong đó thời gian thử việc (nếu có) từ ngày ...... tháng ...... năm ...... đến ngày ...... tháng ...... năm ......\nTrong thời hạn 30 ngày kể từ ngày hợp đồng lao động này hết hạn, bên A và bên B phải thỏa thuận để ký kết hợp đồng lao động mới; trong thời gian chưa ký kết hợp đồng lao động mới thì quyền, nghĩa vụ và lợi ích của hai bên được thực hiện theo hợp đồng này.\nTrường hợp bên A và bên B tiếp tục thỏa thuận ký kết hợp đồng lao động mới là hợp đồng xác định thời hạn thì chỉ được ký thêm 01 lần. Hết thời hạn ký hợp đồng lần thứ 2, nếu bên B vẫn tiếp tục làm việc thì phải ký kết hợp đồng lao động không xác định thời hạn.\nTrường hợp hết thời hạn 30 ngày kể từ ngày hợp đồng lao động này hết hạn mà bên A và bên B không ký kết hợp đồng lao động mới và không có thỏa thuận khác thì hợp đồng này đương nhiên trở thành hợp đồng lao động không xác định thời hạn.\n(1.2)\nBên A và bên B thỏa thuận ký kết hợp đồng không xác định thời hạn, có hiệu lực kể từ ngày....tháng.....năm.....(hoặc kể từ ngày ký kết hợp đồng)\n2. Công việc\na) Địa điểm làm việc2: .......................................................................................\nb) Bộ phận/Đơn vị quản lý3: ..............................................................................\nc) Vị trí việc làm4: ............................................................................................\nd) Nhiệm vụ5: ....................................................................................................\nĐiều 2. Quyền và nghĩa vụ của Bên B\nNgoài thực hiện các quyền, nghĩa vụ theo quy định của pháp luật về lao động và quy định của pháp luật khác có liên quan, bên B còn thực hiện các quyền, nghĩa vụ sau:\n1. Quyền của Bên B\na) Tiền lương, thưởng và các khoản phụ cấp, bổ sung khác\n- Mức lương:………………………………………………………………………………………..\n(Hai bên thỏa thuận mức lương theo một trong hai hình thức quy định tại điểm a, khoản 2 Điều 8 Nghị định số 111/2022/NĐ-CP).\n- Tiền lương trong thời gian thử việc (nếu có): ................................... được hưởng từ ngày ….. đến ngày ….\n- Các khoản phụ cấp, bổ sung (nếu có):...............................................................................\n- Hình thức trả lương (tiền mặt/chuyển khoản):....................................................................\n- Kỳ hạn trả lương:………………………………………………………………………………….\n- Tiền lương được trả vào: ………………………………………………………………………..\n- Chế độ nâng bậc, nâng lương (ghi rõ thời gian, điều kiện và các trường hợp được nâng bậc, nâng lương nếu có):................................................................................................\n- Thưởng (ghi rõ điều kiện và các trường hợp được thưởng, mức thưởng nếu có):……....................................................................................................................\n- Tiền tàu xe về nơi cư trú của bên B (ghi rõ các trường hợp được hỗ trợ tiền tàu xe về nơi cư trú, mức hỗ trợ) (nếu có):.........................................................................................\n- Hỗ trợ nâng cao trình độ chuyên môn, nghiệp vụ (nếu có):……….....................................\nb) Thời giờ làm việc, thời giờ nghỉ ngơi\n- Thời giờ làm việc:................................................................................................................\n- Thời giờ bên B được nghỉ liên tục trong ngày:....................................................................\n- Ngày nghỉ hằng tuần:...........................................................................................................\n- Ngày nghỉ hằng năm:...........................................................................................................\n- Ngày nghỉ lễ, Tết:.................................................................................................................\nc) Điều kiện lao động\n- Bên B được cung cấp (miễn phí) trang thiết bị bảo hộ lao động phù hợp với công việc và được bên A bảo đảm an toàn lao động, vệ sinh lao động trong thời gian làm việc theo hợp đồng. Bên B có trách nhiệm sử dụng, bảo quản các trang thiết bị bảo hộ lao động và tuân thủ các quy định về an toàn lao động, vệ sinh lao động.\n- Bên B có trách nhiệm tham gia và được hưởng các chế độ bảo hiểm xã hội, bảo hiểm y tế, bảo hiểm thất nghiệp và các loại bảo hiểm khác theo quy định của pháp luật.\nLiệt kê các loại bảo hiểm khác (nếu có): ..............................................................................\nMức đóng của các bên cụ thể như sau6: ..............................................................................\nd) Quyền khác theo thoả thuận7:...........................................................................................\n2. Nghĩa vụ của bên B\na) Thực hiện các nhiệm vụ theo thoả thuận trong hợp đồng lao động.\nb) Cung cấp văn bản, giấy tờ xác minh đủ tiêu chuẩn, điều kiện thực hiện công việc thoả thuận theo yêu cầu của bên A.\nc) Chấp hành quy định, nội quy, quy chế của cơ quan, đơn vị sử dụng lao động, kỷ luật làm việc và các quy định pháp luật.\nd) Chấp hành việc xử lý vi phạm kỷ luật lao động và trách nhiệm bồi thường, hoàn trả theo quy định của pháp luật.\nđ) Tuân thủ các quy định về bảo mật theo yêu cầu của bên A.\ne) Chấp hành sự quản lý, điều hành, giám sát của người sử dụng lao động.\ng) Thuế thu nhập cá nhân (nếu có) do bên B đóng. Cơ quan, đơn vị sẽ tạm khấu trừ trước khi chi trả cho bên B theo quy định.\nh) Nghĩa vụ khác theo thoả thuận8: ......................................................................................\nĐiều 3. Quyền và nghĩa vụ của bên A\n1. Quyền của bên A\na) Yêu cầu bên B thực hiện công việc và tuân thủ các nghĩa vụ theo đúng thoả thuận tại hợp đồng này.\nb) Trường hợp bên B vi phạm nghĩa vụ thì bên A có quyền đơn phương chấm dứt thực hiện hợp đồng và yêu cầu bồi thường thiệt hại.\nc) Quyền khác theo thoả thuận9:...........................................................................................\n2. Nghĩa vụ của bên A\na) Chi trả lương, thực hiện chế độ, chính sách khác cho người lao động theo thoả thuận bảo đảm phù hợp với quy định của pháp luật lao động và quy định của pháp luật khác có liên quan.\nb) Cung cấp thông tin, tài liệu và các phương tiện, điều kiện làm việc cần thiết để bên B thực hiện công việc.\nc) Bảo đảm quyền, lợi ích hợp pháp của người lao động theo thoả thuận tại hợp đồng và quy định của pháp luật về lao động.\nd) Nghĩa vụ khác theo thoả thuận10: .....................................................................................\nĐiều 4. Tạm hoãn, chấm dứt hợp đồng lao động\n1. Việc tạm hoãn, chấm dứt hợp đồng giữa các bên được thực hiện theo quy định của pháp luật về lao động.\n2. Bên B bị coi là vi phạm hợp đồng khi thuộc một trong các trường hợp sau đây:\na) Không thực hiện hoặc thực hiện không đúng, không đầy đủ và chậm thực hiện bất kỳ nghĩa vụ nào quy định trong hợp đồng này.\nb) Vi phạm kỷ luật lao động.\nc) Đơn phương chấm dứt hợp đồng trái quy định.\n3. Trường hợp bên A vi phạm nghiêm trọng nghĩa vụ thì bên B có quyền đơn phương chấm dứt thực hiện hợp đồng và yêu cầu bồi thường thiệt hại.\n4. Trong thời gian thử việc, nếu bên B không đáp ứng được yêu cầu thì bên A có quyền chấm dứt hợp đồng lao động với bên B trước thời hạn.\nĐiều 5. Phương thức giải quyết tranh chấp\nTrong quá trình thực hiện hợp đồng, nếu có vấn đề phát sinh cần giải quyết thì hai bên thoả thuận và thống nhất giải quyết kịp thời, bảo đảm phù hợp với các quy định của pháp luật.\nTrường hợp không thoả thuận được thì một trong các bên có quyền khởi kiện yêu cầu giải quyết tại Toà án có thẩm quyền theo quy định của pháp luật.\nĐiều 6. Điều khoản thi hành\na) Hợp đồng có hiệu lực từ ngày ...... tháng ...... năm ......\nb) Trong quá trình thực hiện hợp đồng lao động, nếu bên nào có yêu cầu sửa đổi, bổ sung nội dung hợp đồng thì phải báo cho bên kia biết trước ít nhất 03 ngày làm việc về nội dung cần sửa đổi, bổ sung.\nTrường hợp hai bên thỏa thuận được thì việc sửa đổi, bổ sung nội dung hợp đồng lao động được tiến hành bằng việc ký kết phụ lục hợp đồng lao động hoặc ký kết hợp đồng lao động mới.\nTrường hợp hai bên không thỏa thuận được việc sửa đổi, bổ sung nội dung hợp đồng lao động thì tiếp tục thực hiện hợp đồng lao động đã ký kết.\nc) Những vấn đề về lao động khác không ghi trong hợp đồng này được thực hiện theo quy định tại Bộ luật Lao động và các văn bản quy phạm pháp luật khác có liên quan.\nd) Hợp đồng được làm thành … bản có giá trị pháp lý như nhau, mỗi bên giữ … bản, … bản lưu trong hồ sơ của bên B./.\n(Căn cứ vào quy định của pháp luật và nhu cầu thực tiễn, các bên có thể thoả thuận bổ sung các nội dung về quyền, nghĩa vụ của các bên và các nội dung khác quy định tại các điều khoản cụ thể)\n\nBên A (Ký tên, đóng dấu)\n Bên B (Ký tên)\n\n\n\n\u0001\n1 Ghi rõ thời hạn sử dụng dịch vụ, nội dung công việc đảm bảo quy định tại Mục 9 Chương XVI Bộ luật Dân sự năm 2015, số người làm việc, địa điểm làm việc và các nội dung khác theo thoả thuận của các bên.\n2 Thỏa thuận khác là những thỏa thuận gắn với tính chất, đặc điểm của ngành, lĩnh vực và điều kiện đặc thù của cơ quan, đơn vị sử dụng dịch vụ nhưng không trái với quy định của pháp luật.\n1 Không quá 36 tháng theo quy định của Bộ luật Lao động.\n2 Ghi cụ thể số nhà, phố, phường (thôn, xã), quận (huyện, thị xã), tỉnh, thành phố thuộc tỉnh hoặc Trung ương. Trường hợp bên B làm việc có tính chất thường xuyên ở nhiều địa điểm khác nhau thì ghi đầy đủ các địa điểm đó.\n3 Bộ phận/Đơn vị thuộc cơ quan, đơn vị sử dụng lao động được phân công quản lý, đánh giá chất lượng công việc của bên B.\n4 Do bên A xác định theo nhu cầu căn cứ (nhưng không bị giới hạn) vào Nghị định số 111/2022/NĐ-CP.\n5 Ghi cụ thể nhiệm vụ phải đảm nhiệm theo yêu cầu của vị trí việc làm hợp đồng và bản mô tả công việc tương ứng.\n6 Liệt kê mức đóng các loại bảo hiểm theo quy định và mức đóng của các bên.\n7 Quyền khác theo thoả thuận là những quyền gắn với tính chất, đặc điểm của ngành, lĩnh vực và điều kiện đặc thù của cơ quan, đơn vị sử dụng lao động nhưng không trái với quy định của pháp luật.\n8 Nghĩa vụ khác theo thoả thuận là những nghĩa vụ gắn với tính chất, đặc điểm của ngành, lĩnh vực và điều kiện đặc thù của cơ quan, đơn vị sử dụng lao động nhưng không trái với quy định của pháp luật.\n9 Quyền khác theo thoả thuận là những quyền gắn với tính chất, đặc điểm của ngành, lĩnh vực và điều kiện đặc thù của cơ quan, đơn vị sử dụng lao động nhưng không trái với quy định của pháp luật.\n10 Nghĩa vụ khác theo thoả thuận là những nghĩa vụ gắn với tính chất, đặc điểm của ngành, lĩnh vực và điều kiện đặc thù của cơ quan, đơn vị sử dụng lao động nhưng không trái với quy định của pháp luật.", "clauses": [{"clause_id": "HDLD005_C001", "section_title": "Điều 1", "clause_text": "Thời hạn của hợp đồng lao động: …. tháng1, kể từ ngày ...... tháng ...... năm ...... đến ngày ...... tháng ...... năm ......, trong đó thời gian thử việc (nếu có) từ ngày ...... tháng ...... năm ...... đến ngày ...... tháng ...... năm ......", "clause_type": "CONTRACT_TERM", "start_offset": 3741, "end_offset": 3982, "offset_quality": "EXACT", "highlight_text": "Thời hạn của hợp đồng lao động: …. tháng1, kể từ ngày ...... tháng ...... năm ...... đến ngày ...... tháng ...... năm ......, trong đó thời gian thử việc (nếu có) từ ngày ...... tháng ...... năm ...... đến ngày ...... tháng ...... năm ......"}, {"clause_id": "HDLD005_C002", "section_title": "Điều 1", "clause_text": "Trong thời hạn 30 ngày kể từ ngày hợp đồng lao động này hết hạn, bên A và bên B phải thỏa thuận để ký kết hợp đồng lao động mới; trong thời gian chưa ký kết hợp đồng lao động mới thì quyền, nghĩa vụ và lợi ích của hai bên được thực hiện theo hợp đồng này.", "clause_type": "CONTRACT_TERM", "start_offset": 3983, "end_offset": 4238, "offset_quality": "EXACT", "highlight_text": "Trong thời hạn 30 ngày kể từ ngày hợp đồng lao động này hết hạn, bên A và bên B phải thỏa thuận để ký kết hợp đồng lao động mới; trong thời gian chưa ký kết hợp đồng lao động mới thì quyền, nghĩa vụ và lợi ích của hai bên được thực hiện theo hợp đồng này."}, {"clause_id": "HDLD005_C003", "section_title": "Điều 1", "clause_text": "Trường hợp bên A và bên B tiếp tục thỏa thuận ký kết hợp đồng lao động mới là hợp đồng xác định thời hạn thì chỉ được ký thêm 01 lần. Hết thời hạn ký hợp đồng lần thứ 2, nếu bên B vẫn tiếp tục làm việc thì phải ký kết hợp đồng lao động không xác định thời hạn.", "clause_type": "CONTRACT_TERM", "start_offset": 4239, "end_offset": 4499, "offset_quality": "EXACT", "highlight_text": "Trường hợp bên A và bên B tiếp tục thỏa thuận ký kết hợp đồng lao động mới là hợp đồng xác định thời hạn thì chỉ được ký thêm 01 lần. Hết thời hạn ký hợp đồng lần thứ 2, nếu bên B vẫn tiếp tục làm việc thì phải ký kết hợp đồng lao động không xác định thời hạn."}, {"clause_id": "HDLD005_C004", "section_title": "Điều 1", "clause_text": "Trường hợp hết thời hạn 30 ngày kể từ ngày hợp đồng lao động này hết hạn mà bên A và bên B không ký kết hợp đồng lao động mới và không có thỏa thuận khác thì hợp đồng này đương nhiên trở thành hợp đồng lao động không xác định thời hạn.", "clause_type": "CONTRACT_TERM", "start_offset": 4500, "end_offset": 4735, "offset_quality": "EXACT", "highlight_text": "Trường hợp hết thời hạn 30 ngày kể từ ngày hợp đồng lao động này hết hạn mà bên A và bên B không ký kết hợp đồng lao động mới và không có thỏa thuận khác thì hợp đồng này đương nhiên trở thành hợp đồng lao động không xác định thời hạn."}, {"clause_id": "HDLD005_C005", "section_title": "Điều 1", "clause_text": "Bên A và bên B thỏa thuận ký kết hợp đồng không xác định thời hạn, có hiệu lực kể từ ngày....tháng.....năm.....(hoặc kể từ ngày ký kết hợp đồng)", "clause_type": "CONTRACT_TERM", "start_offset": 4742, "end_offset": 4886, "offset_quality": "EXACT", "highlight_text": "Bên A và bên B thỏa thuận ký kết hợp đồng không xác định thời hạn, có hiệu lực kể từ ngày....tháng.....năm.....(hoặc kể từ ngày ký kết hợp đồng)"}, {"clause_id": "HDLD005_C006", "section_title": "Điều 1", "clause_text": "a) nâng bậc, nâng lương nếu có):................................................................................................", "clause_type": "COMPENSATION_BENEFITS", "start_offset": 6259, "end_offset": 6466, "offset_quality": "EXACT", "highlight_text": "- Chế độ nâng bậc, nâng lương (ghi rõ thời gian, điều kiện và các trường hợp được nâng bậc, nâng lương nếu có):................................................................................................"}, {"clause_id": "HDLD005_C017", "section_title": "Điều 2", "clause_text": "- Thưởng (ghi rõ điều kiện và các trường hợp được thưởng, mức thưởng nếu có):……....................................................................................................................", "clause_type": "COMPENSATION_BENEFITS", "start_offset": 6467, "end_offset": 6662, "offset_quality": "EXACT", "highlight_text": "- Thưởng (ghi rõ điều kiện và các trường hợp được thưởng, mức thưởng nếu có):……...................................................................................................................."}, {"clause_id": "HDLD005_C018", "section_title": "Điều 2", "clause_text": "- Tiền tàu xe về nơi cư trú của bên B (ghi rõ các trường hợp được hỗ trợ tiền tàu xe về nơi cư trú, mức hỗ trợ) (nếu có):.........................................................................................", "clause_type": "COMPENSATION_BENEFITS", "start_offset": 6663, "end_offset": 6873, "offset_quality": "EXACT", "highlight_text": "- Tiền tàu xe về nơi cư trú của bên B (ghi rõ các trường hợp được hỗ trợ tiền tàu xe về nơi cư trú, mức hỗ trợ) (nếu có):........................................................................................."}, {"clause_id": "HDLD005_C019", "section_title": "Điều 2", "clause_text": "- Hỗ trợ nâng cao trình độ chuyên môn, nghiệp vụ (nếu có):……….....................................", "clause_type": "TRAINING", "start_offset": 6874, "end_offset": 6972, "offset_quality": "EXACT", "highlight_text": "- Hỗ trợ nâng cao trình độ chuyên môn, nghiệp vụ (nếu có):………....................................."}, {"clause_id": "HDLD005_C020", "section_title": "Điều 2", "clause_text": "- Thời giờ làm việc:................................................................................................................", "clause_type": "WORKING_TIME", "start_offset": 7014, "end_offset": 7146, "offset_quality": "EXACT", "highlight_text": "- Thời giờ làm việc:................................................................................................................"}, {"clause_id": "HDLD005_C021", "section_title": "Điều 2", "clause_text": "- Thời giờ bên B được nghỉ liên tục trong ngày:....................................................................", "clause_type": "WORKING_TIME", "start_offset": 7147, "end_offset": 7262, "offset_quality": "EXACT", "highlight_text": "- Thời giờ bên B được nghỉ liên tục trong ngày:...................................................................."}, {"clause_id": "HDLD005_C022", "section_title": "Điều 2", "clause_text": "- Ngày nghỉ hằng tuần:...........................................................................................................", "clause_type": "LEAVE", "start_offset": 7263, "end_offset": 7392, "offset_quality": "EXACT", "highlight_text": "- Ngày nghỉ hằng tuần:..........................................................................................................."}, {"clause_id": "HDLD005_C023", "section_title": "Điều 2", "clause_text": "- Ngày nghỉ hằng năm:...........................................................................................................", "clause_type": "LEAVE", "start_offset": 7393, "end_offset": 7521, "offset_quality": "EXACT", "highlight_text": "- Ngày nghỉ hằng năm:..........................................................................................................."}, {"clause_id": "HDLD005_C024", "section_title": "Điều 2", "clause_text": "- Ngày nghỉ lễ, Tết:.................................................................................................................", "clause_type": "LEAVE", "start_offset": 7522, "end_offset": 7655, "offset_quality": "EXACT", "highlight_text": "- Ngày nghỉ lễ, Tết:................................................................................................................."}, {"clause_id": "HDLD005_C025", "section_title": "Điều 2", "clause_text": "- Bên B được cung cấp (miễn phí) trang thiết bị bảo hộ lao động phù hợp với công việc và được bên A bảo đảm an toàn lao động, vệ sinh lao động trong thời gian làm việc theo hợp đồng. Bên B có trách nhiệm sử dụng, bảo quản các trang thiết bị bảo hộ lao động và tuân thủ các quy định về an toàn lao động, vệ sinh lao động.", "clause_type": "INSURANCE_SAFETY", "start_offset": 7678, "end_offset": 7998, "offset_quality": "EXACT", "highlight_text": "- Bên B được cung cấp (miễn phí) trang thiết bị bảo hộ lao động phù hợp với công việc và được bên A bảo đảm an toàn lao động, vệ sinh lao động trong thời gian làm việc theo hợp đồng. Bên B có trách nhiệm sử dụng, bảo quản các trang thiết bị bảo hộ lao động và tuân thủ các quy định về an toàn lao động, vệ sinh lao động."}, {"clause_id": "HDLD005_C026", "section_title": "Điều 2", "clause_text": "- Bên B có trách nhiệm tham gia và được hưởng các chế độ bảo hiểm xã hội, bảo hiểm y tế, bảo hiểm thất nghiệp và các loại bảo hiểm khác theo quy định của pháp luật.", "clause_type": "INSURANCE_SAFETY", "start_offset": 7999, "end_offset": 8163, "offset_quality": "EXACT", "highlight_text": "- Bên B có trách nhiệm tham gia và được hưởng các chế độ bảo hiểm xã hội, bảo hiểm y tế, bảo hiểm thất nghiệp và các loại bảo hiểm khác theo quy định của pháp luật."}, {"clause_id": "HDLD005_C027", "section_title": "Điều 2", "clause_text": "Mức đóng của các bên cụ thể như sau6: ..............................................................................", "clause_type": "INSURANCE_SAFETY", "start_offset": 8284, "end_offset": 8400, "offset_quality": "EXACT", "highlight_text": "Mức đóng của các bên cụ thể như sau6: .............................................................................."}, {"clause_id": "HDLD005_C028", "section_title": "Điều 2", "clause_text": "a) Thực hiện các nhiệm vụ theo thoả thuận trong hợp đồng lao động.", "clause_type": "EMPLOYEE_OBLIGATIONS_DISCIPLINE", "start_offset": 8546, "end_offset": 8612, "offset_quality": "EXACT", "highlight_text": "a) Thực hiện các nhiệm vụ theo thoả thuận trong hợp đồng lao động."}, {"clause_id": "HDLD005_C029", "section_title": "Điều 2", "clause_text": "b) Cung cấp văn bản, giấy tờ xác minh đủ tiêu chuẩn, điều kiện thực hiện công việc thoả thuận theo yêu cầu của bên A.", "clause_type": "EMPLOYEE_OBLIGATIONS_DISCIPLINE", "start_offset": 8613, "end_offset": 8730, "offset_quality": "EXACT", "highlight_text": "b) Cung cấp văn bản, giấy tờ xác minh đủ tiêu chuẩn, điều kiện thực hiện công việc thoả thuận theo yêu cầu của bên A."}, {"clause_id": "HDLD005_C030", "section_title": "Điều 2", "clause_text": "c) Chấp hành quy định, nội quy, quy chế của cơ quan, đơn vị sử dụng lao động, kỷ luật làm việc và các quy định pháp luật.", "clause_type": "EMPLOYEE_OBLIGATIONS_DISCIPLINE", "start_offset": 8731, "end_offset": 8852, "offset_quality": "EXACT", "highlight_text": "c) Chấp hành quy định, nội quy, quy chế của cơ quan, đơn vị sử dụng lao động, kỷ luật làm việc và các quy định pháp luật."}, {"clause_id": "HDLD005_C031", "section_title": "Điều 2", "clause_text": "d) Chấp hành việc xử lý vi phạm kỷ luật lao động và trách nhiệm bồi thường, hoàn trả theo quy định của pháp luật.", "clause_type": "EMPLOYEE_OBLIGATIONS_DISCIPLINE", "start_offset": 8853, "end_offset": 8966, "offset_quality": "EXACT", "highlight_text": "d) Chấp hành việc xử lý vi phạm kỷ luật lao động và trách nhiệm bồi thường, hoàn trả theo quy định của pháp luật."}, {"clause_id": "HDLD005_C032", "section_title": "Điều 2", "clause_text": "đ) Tuân thủ các quy định về bảo mật theo yêu cầu của bên A.", "clause_type": "EMPLOYEE_OBLIGATIONS_DISCIPLINE", "start_offset": 8967, "end_offset": 9026, "offset_quality": "EXACT", "highlight_text": "đ) Tuân thủ các quy định về bảo mật theo yêu cầu của bên A."}, {"clause_id": "HDLD005_C033", "section_title": "Điều 2", "clause_text": "e) Chấp hành sự quản lý, điều hành, giám sát của người sử dụng lao động.", "clause_type": "EMPLOYEE_OBLIGATIONS_DISCIPLINE", "start_offset": 9027, "end_offset": 9099, "offset_quality": "EXACT", "highlight_text": "e) Chấp hành sự quản lý, điều hành, giám sát của người sử dụng lao động."}, {"clause_id": "HDLD005_C034", "section_title": "Điều 2", "clause_text": "g) Thuế thu nhập cá nhân (nếu có) do bên B đóng. Cơ quan, đơn vị sẽ tạm khấu trừ trước khi chi trả cho bên B theo quy định.", "clause_type": "EMPLOYEE_OBLIGATIONS_DISCIPLINE", "start_offset": 9100, "end_offset": 9223, "offset_quality": "EXACT", "highlight_text": "g) Thuế thu nhập cá nhân (nếu có) do bên B đóng. Cơ quan, đơn vị sẽ tạm khấu trừ trước khi chi trả cho bên B theo quy định."}, {"clause_id": "HDLD005_C035", "section_title": "Điều 3", "clause_text": "a) Yêu cầu bên B thực hiện công việc và tuân thủ các nghĩa vụ theo đúng thoả thuận tại hợp đồng này.", "clause_type": "EMPLOYER_RIGHTS_OBLIGATIONS", "start_offset": 9401, "end_offset": 9501, "offset_quality": "EXACT", "highlight_text": "a) Yêu cầu bên B thực hiện công việc và tuân thủ các nghĩa vụ theo đúng thoả thuận tại hợp đồng này."}, {"clause_id": "HDLD005_C036", "section_title": "Điều 3", "clause_text": "b) Trường hợp bên B vi phạm nghĩa vụ thì bên A có quyền đơn phương chấm dứt thực hiện hợp đồng và yêu cầu bồi thường thiệt hại.", "clause_type": "TERMINATION", "start_offset": 9502, "end_offset": 9629, "offset_quality": "EXACT", "highlight_text": "b) Trường hợp bên B vi phạm nghĩa vụ thì bên A có quyền đơn phương chấm dứt thực hiện hợp đồng và yêu cầu bồi thường thiệt hại."}, {"clause_id": "HDLD005_C037", "section_title": "Điều 3", "clause_text": "a) Chi trả lương, thực hiện chế độ, chính sách khác cho người lao động theo thoả thuận bảo đảm phù hợp với quy định của pháp luật lao động và quy định của pháp luật khác có liên quan.", "clause_type": "EMPLOYER_RIGHTS_OBLIGATIONS", "start_offset": 9775, "end_offset": 9958, "offset_quality": "EXACT", "highlight_text": "a) Chi trả lương, thực hiện chế độ, chính sách khác cho người lao động theo thoả thuận bảo đảm phù hợp với quy định của pháp luật lao động và quy định của pháp luật khác có liên quan."}, {"clause_id": "HDLD005_C038", "section_title": "Điều 3", "clause_text": "b) Cung cấp thông tin, tài liệu và các phương tiện, điều kiện làm việc cần thiết để bên B thực hiện công việc.", "clause_type": "WORKING_CONDITIONS", "start_offset": 9959, "end_offset": 10069, "offset_quality": "EXACT", "highlight_text": "b) Cung cấp thông tin, tài liệu và các phương tiện, điều kiện làm việc cần thiết để bên B thực hiện công việc."}, {"clause_id": "HDLD005_C039", "section_title": "Điều 3", "clause_text": "c) Bảo đảm quyền, lợi ích hợp pháp của người lao động theo thoả thuận tại hợp đồng và quy định của pháp luật về lao động.", "clause_type": "EMPLOYER_RIGHTS_OBLIGATIONS", "start_offset": 10070, "end_offset": 10191, "offset_quality": "EXACT", "highlight_text": "c) Bảo đảm quyền, lợi ích hợp pháp của người lao động theo thoả thuận tại hợp đồng và quy định của pháp luật về lao động."}, {"clause_id": "HDLD005_C040", "section_title": "Điều 4", "clause_text": "1. Việc tạm hoãn, chấm dứt hợp đồng giữa các bên được thực hiện theo quy định của pháp luật về lao động.", "clause_type": "TERMINATION", "start_offset": 10359, "end_offset": 10463, "offset_quality": "EXACT", "highlight_text": "1. Việc tạm hoãn, chấm dứt hợp đồng giữa các bên được thực hiện theo quy định của pháp luật về lao động."}, {"clause_id": "HDLD005_C041", "section_title": "Điều 4", "clause_text": "2. Bên B bị coi là vi phạm hợp đồng khi thuộc một trong các trường hợp sau đây: a) Không thực hiện hoặc thực hiện không đúng, không đầy đủ và chậm thực hiện bất kỳ nghĩa vụ nào quy định trong hợp đồng này. b) Vi phạm kỷ luật lao động. c) Đơn phương chấm dứt hợp đồng trái quy định.", "clause_type": "EMPLOYEE_OBLIGATIONS_DISCIPLINE", "start_offset": 10464, "end_offset": 10745, "offset_quality": "EXACT", "highlight_text": "2. Bên B bị coi là vi phạm hợp đồng khi thuộc một trong các trường hợp sau đây:\na) Không thực hiện hoặc thực hiện không đúng, không đầy đủ và chậm thực hiện bất kỳ nghĩa vụ nào quy định trong hợp đồng này.\nb) Vi phạm kỷ luật lao động.\nc) Đơn phương chấm dứt hợp đồng trái quy định."}, {"clause_id": "HDLD005_C042", "section_title": "Điều 4", "clause_text": "3. Trường hợp bên A vi phạm nghiêm trọng nghĩa vụ thì bên B có quyền đơn phương chấm dứt thực hiện hợp đồng và yêu cầu bồi thường thiệt hại.", "clause_type": "TERMINATION", "start_offset": 10746, "end_offset": 10886, "offset_quality": "EXACT", "highlight_text": "3. Trường hợp bên A vi phạm nghiêm trọng nghĩa vụ thì bên B có quyền đơn phương chấm dứt thực hiện hợp đồng và yêu cầu bồi thường thiệt hại."}, {"clause_id": "HDLD005_C043", "section_title": "Điều 4", "clause_text": "4. Trong thời gian thử việc, nếu bên B không đáp ứng được yêu cầu thì bên A có quyền chấm dứt hợp đồng lao động với bên B trước thời hạn.", "clause_type": "TERMINATION", "start_offset": 10887, "end_offset": 11024, "offset_quality": "EXACT", "highlight_text": "4. Trong thời gian thử việc, nếu bên B không đáp ứng được yêu cầu thì bên A có quyền chấm dứt hợp đồng lao động với bên B trước thời hạn."}, {"clause_id": "HDLD005_C044", "section_title": "Điều 5", "clause_text": "Trong quá trình thực hiện hợp đồng, nếu có vấn đề phát sinh cần giải quyết thì hai bên thoả thuận và thống nhất giải quyết kịp thời, bảo đảm phù hợp với các quy định của pháp luật.", "clause_type": "OTHER", "start_offset": 11067, "end_offset": 11247, "offset_quality": "EXACT", "highlight_text": "Trong quá trình thực hiện hợp đồng, nếu có vấn đề phát sinh cần giải quyết thì hai bên thoả thuận và thống nhất giải quyết kịp thời, bảo đảm phù hợp với các quy định của pháp luật."}, {"clause_id": "HDLD005_C045", "section_title": "Điều 5", "clause_text": "Trường hợp không thoả thuận được thì một trong các bên có quyền khởi kiện yêu cầu giải quyết tại Toà án có thẩm quyền theo quy định của pháp luật.", "clause_type": "OTHER", "start_offset": 11248, "end_offset": 11394, "offset_quality": "EXACT", "highlight_text": "Trường hợp không thoả thuận được thì một trong các bên có quyền khởi kiện yêu cầu giải quyết tại Toà án có thẩm quyền theo quy định của pháp luật."}, {"clause_id": "HDLD005_C046", "section_title": "Điều 6", "clause_text": "a) Hợp đồng có hiệu lực từ ngày ...... tháng ...... năm ......", "clause_type": "CONTRACT_TERM", "start_offset": 11423, "end_offset": 11485, "offset_quality": "EXACT", "highlight_text": "a) Hợp đồng có hiệu lực từ ngày ...... tháng ...... năm ......"}, {"clause_id": "HDLD005_C047", "section_title": "Điều 6", "clause_text": "b) Trong quá trình thực hiện hợp đồng lao động, nếu bên nào có yêu cầu sửa đổi, bổ sung nội dung hợp đồng thì phải báo cho bên kia biết trước ít nhất 03 ngày làm việc về nội dung cần sửa đổi, bổ sung.", "clause_type": "OTHER", "start_offset": 11486, "end_offset": 11686, "offset_quality": "EXACT", "highlight_text": "b) Trong quá trình thực hiện hợp đồng lao động, nếu bên nào có yêu cầu sửa đổi, bổ sung nội dung hợp đồng thì phải báo cho bên kia biết trước ít nhất 03 ngày làm việc về nội dung cần sửa đổi, bổ sung."}, {"clause_id": "HDLD005_C048", "section_title": "Điều 6", "clause_text": "Trường hợp hai bên thỏa thuận được thì việc sửa đổi, bổ sung nội dung hợp đồng lao động được tiến hành bằng việc ký kết phụ lục hợp đồng lao động hoặc ký kết hợp đồng lao động mới.", "clause_type": "OTHER", "start_offset": 11687, "end_offset": 11867, "offset_quality": "EXACT", "highlight_text": "Trường hợp hai bên thỏa thuận được thì việc sửa đổi, bổ sung nội dung hợp đồng lao động được tiến hành bằng việc ký kết phụ lục hợp đồng lao động hoặc ký kết hợp đồng lao động mới."}, {"clause_id": "HDLD005_C049", "section_title": "Điều 6", "clause_text": "Trường hợp hai bên không thỏa thuận được việc sửa đổi, bổ sung nội dung hợp đồng lao động thì tiếp tục thực hiện hợp đồng lao động đã ký kết.", "clause_type": "OTHER", "start_offset": 11868, "end_offset": 12009, "offset_quality": "EXACT", "highlight_text": "Trường hợp hai bên không thỏa thuận được việc sửa đổi, bổ sung nội dung hợp đồng lao động thì tiếp tục thực hiện hợp đồng lao động đã ký kết."}, {"clause_id": "HDLD005_C050", "section_title": "Điều 6", "clause_text": "c) Những vấn đề về lao động khác không ghi trong hợp đồng này được thực hiện theo quy định tại Bộ luật Lao động và các văn bản quy phạm pháp luật khác có liên quan.", "clause_type": "OTHER", "start_offset": 12010, "end_offset": 12174, "offset_quality": "EXACT", "highlight_text": "c) Những vấn đề về lao động khác không ghi trong hợp đồng này được thực hiện theo quy định tại Bộ luật Lao động và các văn bản quy phạm pháp luật khác có liên quan."}, {"clause_id": "HDLD005_C051", "section_title": "Điều 6", "clause_text": "d) Hợp đồng được làm thành … bản có giá trị pháp lý như nhau, mỗi bên giữ … bản, … bản lưu trong hồ sơ của bên B./.", "clause_type": "OTHER", "start_offset": 12175, "end_offset": 12290, "offset_quality": "EXACT", "highlight_text": "d) Hợp đồng được làm thành … bản có giá trị pháp lý như nhau, mỗi bên giữ … bản, … bản lưu trong hồ sơ của bên B./."}]}</script>
  <script>
    const payload = JSON.parse(document.getElementById("contract-payload").textContent);
    const chars = Array.from(payload.raw_text);
    const list = document.getElementById("clause-list");
    const raw = document.getElementById("raw-text");
    const search = document.getElementById("search");
    const filter = document.getElementById("quality-filter");
    let selectedId = payload.clauses.find(row => row.clause_id === "HDLD003_C018")?.clause_id || payload.clauses[0]?.clause_id;

    const exactCount = payload.clauses.filter(row => row.offset_quality === "EXACT").length;
    document.getElementById("contract-summary").textContent = `${payload.contract_id} · ${payload.clauses.length} điều khoản · ${exactCount} EXACT · ${payload.clauses.length - exactCount} CONTEXT`;

    function showClause(row) {
      selectedId = row.clause_id;
      document.getElementById("selected-title").textContent = row.clause_id;
      document.getElementById("selected-meta").textContent = `${row.section_title} · ${row.clause_type} · ${row.offset_quality} · [${row.start_offset}, ${row.end_offset})`;
      document.getElementById("selected-clause").textContent = row.clause_text;
      document.getElementById("selected-note").textContent = row.offset_quality === "EXACT"
        ? "Đoạn bôi khớp điều khoản sau khi chuẩn hóa khoảng trắng."
        : "Đoạn bôi là cụm từ nguồn liên quan; điều khoản đã được tách/chuẩn hóa nên không khớp nguyên văn toàn câu.";
      const before = document.createTextNode(chars.slice(0, row.start_offset).join(""));
      const mark = document.createElement("mark");
      mark.id = "active-highlight";
      mark.textContent = chars.slice(row.start_offset, row.end_offset).join("");
      const after = document.createTextNode(chars.slice(row.end_offset).join(""));
      raw.replaceChildren(before, mark, after);
      requestAnimationFrame(() => mark.scrollIntoView({block: "center", behavior: "instant"}));
    }

    function showList() {
      const term = search.value.trim().toLocaleLowerCase("vi");
      const quality = filter.value;
      const visible = payload.clauses.filter(row =>
        (quality === "ALL" || row.offset_quality === quality) &&
        (!term || `${row.clause_id} ${row.clause_text}`.toLocaleLowerCase("vi").includes(term))
      );
      document.getElementById("list-count").textContent = `${visible.length} / ${payload.clauses.length} điều khoản`;
      list.replaceChildren();
      for (const row of visible) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "clause-button" + (row.clause_id === selectedId ? " selected" : "");
        button.dataset.clauseId = row.clause_id;
        const id = document.createElement("span");
        id.className = "clause-id";
        id.textContent = `${row.clause_id} · ${row.section_title}`;
        const summary = document.createElement("span");
        summary.className = "clause-summary";
        summary.textContent = row.clause_text;
        const badge = document.createElement("span");
        badge.className = "badge" + (row.offset_quality === "CONTEXT" ? " context" : "");
        badge.textContent = row.offset_quality;
        button.append(id, summary, badge);
        button.addEventListener("click", () => { showClause(row); showList(); });
        list.append(button);
      }
    }

    search.addEventListener("input", showList);
    filter.addEventListener("change", showList);
    showList();
    if (selectedId) showClause(payload.clauses.find(row => row.clause_id === selectedId));
  </script>
